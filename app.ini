APP_NAME = Gitea
RUN_USER = zerops
RUN_MODE = prod
WORK_PATH = {{.GITEA_WORK_DIR}}

[server]
PROTOCOL         = http
DOMAIN           = {{.GITEA_DOMAIN}}
ROOT_URL         = https://{{.GITEA_DOMAIN}}
HTTP_ADDR        = 0.0.0.0
HTTP_PORT        = 3000
SSH_DOMAIN       = {{.GITEA_DOMAIN}}
START_SSH_SERVER = true
SSH_PORT         = 2222
SSH_LISTEN_PORT  = 2222
LFS_START_SERVER = true
APP_DATA_PATH    = {{.GITEA_WORK_DIR}}/data
DISABLE_SSH      = false
LFS_JWT_SECRET   = {{.LFS_JWT_SECRET}}

[database]
DB_TYPE  = postgres
HOST     = {{.DB_HOST}}:{{.DB_PORT}}
NAME     = {{.DB_NAME}}
USER     = {{.DB_USER}}
PASSWD   = {{.DB_PASSWORD}}
SSL_MODE = disable
SCHEMA   = public

[repository]
ROOT = {{.GITEA_WORK_DIR}}/data/gitea-repositories

[lfs]
PATH = {{.GITEA_WORK_DIR}}/data/lfs

[log]
ROOT_PATH = {{.GITEA_WORK_DIR}}/log
MODE      = console
LEVEL     = info

[service]
DISABLE_REGISTRATION              = true
REQUIRE_SIGNIN_VIEW               = false
DEFAULT_KEEP_EMAIL_PRIVATE        = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true

[security]
INSTALL_LOCK   = true
SECRET_KEY     = {{.SECRET_KEY}}
INTERNAL_TOKEN = {{.INTERNAL_TOKEN}}

[oauth2]
JWT_SECRET = {{.JWT_SECRET}}

[session]
PROVIDER = file

# The API is called from browsers. A Zerops Mate client on another origin asks
# this instance what version it is and who its users are, and mints the tokens
# its agents push with; without this the browser blocks every one of those reads
# and the client can only report "unknown". Gitea's own defaults cover the
# methods, and its API router always allows the Authorization header, so only
# these three are worth writing down.
#
# Any origin, and no credentials: an allowlist cannot be written because the
# client is served from wherever its owner runs it, and CORS grants no authority
# of its own — every route still demands a token or basic auth. ALLOW_CREDENTIALS
# stays false so a signed-in browser's Gitea session cookie can never be used by
# another origin.
[cors]
ENABLED           = true
ALLOW_DOMAIN      = *
ALLOW_CREDENTIALS = false
