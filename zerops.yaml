zerops:
  - setup: web
    build:
      base: ubuntu@26.04
      deployFiles:
        - app.ini
        - init.sh
        - start.sh
    run:
      base: ubuntu@26.04
      ports:
        - port: 3000
          httpSupport: true
        - port: 2222
      envVariables:
        GITEA_VERSION: 1.27.2
        GITEA_WORK_DIR: /mnt/volume/gitea
        DB_HOST: db
        DB_PORT: 5432
        DB_NAME: giteadb
        DB_USER: gitea
        # Superuser of the db service - only used by init-db.sh to create the gitea role and database.
        DB_ADMIN_USER: ${db_superUser}
        DB_ADMIN_PASSWORD: ${db_superUserPassword}
        DB_ADMIN_DB: ${db_dbName}
      volume:
        hostname: volume
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y --no-install-recommends git ca-certificates gettext-base wget gpg postgresql-client
        - wget -q -O /tmp/gitea https://dl.gitea.com/gitea/${GITEA_VERSION}/gitea-${GITEA_VERSION}-linux-amd64
        - wget -q -O /tmp/gitea.asc https://dl.gitea.com/gitea/${GITEA_VERSION}/gitea-${GITEA_VERSION}-linux-amd64.asc
        - gpg --keyserver hkps://keys.openpgp.org --recv 7C9E68152594688862D62AF62D9AE806EC1592E2
        - gpg --verify /tmp/gitea.asc /tmp/gitea
        - sudo install -m 755 /tmp/gitea /usr/local/bin/gitea
        # - sudo groupadd --system git
        # - sudo useradd --system --gid git --shell /bin/bash --home-dir /home/git --create-home git
        - sudo mkdir -p /etc/gitea
        - sudo chown root:zerops /etc/gitea
        - sudo chmod 770 /etc/gitea
      initCommands:
        - zsc execOnce prepare-gitea -- ./init.sh
      start: ./start.sh

  - setup: runner
    build:
      base: ubuntu@26.04
      deployFiles:
        - runner-init.sh
    run:
      base: ubuntu@26.04
      envVariables:
        GITEA_RUNNER_VERSION: 3.3.1
        GITEA_INSTANCE_URL: http://web:3000
        RUNNER_LABELS: ubuntu-latest:host,ubuntu-26.04:host
      prepareCommands:
        - sudo apt-get update
        # Host-mode jobs run directly on the container, so ship what workflows commonly need - git for
        # checkouts and nodejs for JS actions (actions/checkout etc.). Add your own tools here.
        - sudo apt-get install -y --no-install-recommends git ca-certificates nodejs wget
        - wget -q -P /tmp https://dl.gitea.com/gitea-runner/${GITEA_RUNNER_VERSION}/gitea-runner-${GITEA_RUNNER_VERSION}-linux-amd64
        - wget -q -P /tmp https://dl.gitea.com/gitea-runner/${GITEA_RUNNER_VERSION}/gitea-runner-${GITEA_RUNNER_VERSION}-linux-amd64.sha256
        - cd /tmp && sha256sum -c gitea-runner-${GITEA_RUNNER_VERSION}-linux-amd64.sha256
        - sudo install -m 755 /tmp/gitea-runner-${GITEA_RUNNER_VERSION}-linux-amd64 /usr/local/bin/gitea-runner
        # zcli, so workflows can deploy to Zerops (see README).
        - wget -q -O /tmp/zcli https://github.com/zeropsio/zcli/releases/latest/download/zcli-linux-amd64
        - sudo install -m 755 /tmp/zcli /usr/local/bin/zcli
      initCommands:
        - ./runner-init.sh
      start: gitea-runner daemon
